name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'version_info.txt'
      - 'VERSION'
      - 'games.json'
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'version_info.txt'
      - 'VERSION'
      - 'games.json'
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release_info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate shared release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          date_utc="$(date -u +%Y%m%d)"
          tag="v${version}-${date_utc}-${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build_windows:
    needs: release_info
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Bundle 7-Zip binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" bin\
          Copy-Item "C:\Program Files\7-Zip\7z.dll" bin\

      - name: Inject release version into main.py
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
        run: |
          (Get-Content main.py) -replace '^VERSION = ".*"$', "VERSION = `"$env:RELEASE_TAG`"" |
            Set-Content main.py -Encoding UTF8

      - name: Build onedir (Highball / Wine)
        run: >
          pyinstaller
          --onedir
          --windowed
          --uac-admin
          --noupx
          --version-file version_info.txt
          --collect-all PyQt6
          --hidden-import PyQt6.sip
          --contents-directory .
          --add-data "bin/7z.exe;bin"
          --add-data "bin/7z.dll;bin"
          --name "GameInstaller"
          main.py

      - name: Zip onedir build
        shell: pwsh
        run: Compress-Archive -Path dist\GameInstaller -DestinationPath dist\GameInstaller.zip

      - name: Build onefile (Windows)
        run: >
          pyinstaller
          --onefile
          --windowed
          --uac-admin
          --noupx
          --version-file version_info.txt
          --collect-all PyQt6
          --hidden-import PyQt6.sip
          --add-data "bin/7z.exe;bin"
          --add-data "bin/7z.dll;bin"
          --name "GameInstaller"
          main.py

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: |
            dist/GameInstaller.zip
            dist/GameInstaller.exe
          if-no-files-found: error

  build_macos:
    needs: release_info
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the pinned Highball helper and include its source
        run: bash macos/package_highball_helper.sh

      - name: Build native Mac app
        env:
          APP_DISPLAY_NAME: Game Installer
          APP_BUNDLE_IDENTIFIER: com.kevinawesomecoding.GameInstaller
          RELEASE_VERSION: ${{ needs.release_info.outputs.tag }}
          APP_DESTINATION: ${{ runner.temp }}/Game Installer.app
        run: |
          bash macos/build_preview.sh
          ditto -c -k --sequesterRsrc --keepParent "$APP_DESTINATION" "$RUNNER_TEMP/GameInstaller-macOS.zip"

      - name: Upload Mac release file
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-files
          path: ${{ runner.temp }}/GameInstaller-macOS.zip
          if-no-files-found: error

  publish_release:
    needs: [release_info, build_windows, build_macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-release-files
          path: release-assets

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: macos-release-files
          path: release-assets

      - name: Publish combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_info.outputs.tag }}
          name: Game Installer ${{ needs.release_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/GameInstaller.zip
            release-assets/GameInstaller.exe
            release-assets/GameInstaller-macOS.zip
          body: |
            **Version:** ${{ needs.release_info.outputs.version }}
            **Commit:** `${{ github.sha }}`
            **Trigger:** ${{ github.event_name }}

            ### Windows and Highball users
            Download **`GameInstaller.zip`**, extract it, and run `GameInstaller\GameInstaller.exe`.
            This Windows build also runs inside a configured Highball Windows bottle.

            ### Native macOS users
            Download **`GameInstaller-macOS.zip`**, extract it, then open **Game Installer.app**.
            Requires macOS 14 or later. The app is ad-hoc signed, so macOS may require
            opening it from Finder and approving it in Privacy & Security. Highball's
            version-matched helper can be installed from Settings. Python 3 is still
            required for readiness checks and the current Mac setup flow. The app includes
            the helper's GPL-3.0 license and corresponding source archive.

            **Windows single-file option:** `GameInstaller.exe`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
