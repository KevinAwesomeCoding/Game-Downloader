name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'download_support.py'
      - 'update_support.py'
      - 'host_resolver*.py'
      - 'tools/build_host_helper.py'
      - 'tools/windows_dll_safety*'
      - 'tools/requirements-gofile.txt'
      - 'tests/**'
      - 'version_info.txt'
      - 'VERSION'
      - 'games.json'
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'download_support.py'
      - 'update_support.py'
      - 'host_resolver*.py'
      - 'tools/build_host_helper.py'
      - 'tools/windows_dll_safety*'
      - 'tools/requirements-gofile.txt'
      - 'tests/**'
      - 'version_info.txt'
      - 'VERSION'
      - 'games.json'
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      gofile_probe_url:
        description: Optional public single-file GoFile URL for live range checks
        type: string
        default: ''
      filekeeper_probe_url:
        description: Optional public FileKeeper URL for live range checks
        type: string
        default: ''

jobs:
  release_info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate shared release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          date_utc="$(date -u +%Y%m%d)"
          tag="v${version}-${date_utc}-${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build_windows:
    needs: release_info
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Check updater release selection and download safety
        run: python -m unittest discover -s tests -v

      - name: Build the download browser helper
        run: python tools/build_host_helper.py

      - name: Bundle 7-Zip binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" bin\
          Copy-Item "C:\Program Files\7-Zip\7z.dll" bin\

      - name: Build controlled DLL collision fixture
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools were not found.' }
          $vcvars = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          New-Item -ItemType Directory -Force build\dll-collision-fixture | Out-Null
          $source = (Resolve-Path tools\windows_dll_safety_fixture.c).Path
          $fixture = Join-Path (Resolve-Path build\dll-collision-fixture).Path 'winmm.dll'
          $command = 'call "{0}" -arch=amd64 >nul && cl /nologo /LD "{1}" /link /OUT:"{2}"' -f $vcvars, $source, $fixture
          cmd /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the controlled DLL fixture.' }

      - name: Inject release version into main.py
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
        run: |
          (Get-Content main.py) -replace '^VERSION = ".*"$', "VERSION = `"$env:RELEASE_TAG`"" |
            Set-Content main.py -Encoding UTF8

      - name: Build onedir (Highball / Wine)
        run: >
          pyinstaller
          --onedir
          --windowed
          --uac-admin
          --noupx
          --version-file version_info.txt
          --collect-all PyQt6
          --hidden-import PyQt6.sip
          --contents-directory .
          --runtime-hook tools/windows_dll_safety_hook.py
          --add-data "build/host-resolver/HostResolver;HostResolver"
          --add-data "games.json;."
          --add-data "bin/7z.exe;bin"
          --add-data "bin/7z.dll;bin"
          --name "GameInstaller"
          main.py

      - name: Zip onedir build
        shell: pwsh
        run: |
          python tools/check_windows_dll_safety.py build\dll-collision-fixture\winmm.dll dist\GameInstaller\GameInstaller.exe
          if ($LASTEXITCODE -ne 0) { throw 'Onedir DLL collision smoke check failed.' }
          Compress-Archive -Path dist\GameInstaller -DestinationPath dist\GameInstaller.zip

      - name: Build onefile (Windows)
        run: >
          pyinstaller
          --onefile
          --windowed
          --uac-admin
          --noupx
          --version-file version_info.txt
          --collect-all PyQt6
          --hidden-import PyQt6.sip
          --add-data "build/host-resolver/HostResolver;HostResolver"
          --add-data "games.json;."
          --add-data "bin/7z.exe;bin"
          --add-data "bin/7z.dll;bin"
          --runtime-hook tools/windows_dll_safety_hook.py
          --name "GameInstaller"
          main.py

      - name: Label the single-file Windows x64 asset
        shell: pwsh
        run: Move-Item dist\GameInstaller.exe dist\GameInstaller-windows-x64.exe

      - name: Check the single-file Windows DLL collision
        shell: pwsh
        run: |
          python tools/check_windows_dll_safety.py build\dll-collision-fixture\winmm.dll dist\GameInstaller-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Single-file DLL collision smoke check failed.' }

      - name: Check the packaged Windows browsers
        shell: pwsh
        run: |
          $folder = Start-Process -FilePath dist\GameInstaller\GameInstaller.exe -ArgumentList '--check-download-browser' -Wait -PassThru
          if ($folder.ExitCode -ne 0) { throw "Folder build browser check failed" }
          $single = Start-Process -FilePath dist\GameInstaller-windows-x64.exe -ArgumentList '--check-download-browser' -Wait -PassThru
          if ($single.ExitCode -ne 0) { throw "Single-file build browser check failed" }

      - name: Verify live hosted downloads with the Windows helper
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GOFILE_PROBE_URL: ${{ inputs.gofile_probe_url }}
          FILEKEEPER_PROBE_URL: ${{ inputs.filekeeper_probe_url }}
        run: |
          foreach ($url in @($env:GOFILE_PROBE_URL, $env:FILEKEEPER_PROBE_URL)) {
            if ($url) {
              python tools/gofile_probe.py $url --helper dist\GameInstaller\HostResolver\HostResolver.exe
              if ($LASTEXITCODE -ne 0) { throw "Hosted download range check failed" }
            }
          }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: |
            dist/GameInstaller.zip
            dist/GameInstaller-windows-x64.exe
          if-no-files-found: error

  build_macos:
    needs: release_info
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check shared downloads and Mac backend
        run: |
          python3 -m pip install 'requests>=2.28'
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s macos/backend/tests -v

      - name: Build the pinned Highball helper and include its source
        run: bash macos/package_highball_helper.sh

      - name: Check Steam integration against the packaged Highball CLI
        env:
          HIGHBALL_STEAM_TEST_CLI: ${{ github.workspace }}/macos/GameDownloaderMac/Sources/GameDownloaderMac/Resources/HighballHelper/highball
        run: |
          python3 -B -m unittest discover -s macos/backend/tests -p 'test_steam_integration.py' -v
          python3 -B -m unittest discover -s spikes/highball -p 'test_*.py' -v

      - name: Build native Mac app
        env:
          APP_DISPLAY_NAME: Game Installer
          APP_BUNDLE_IDENTIFIER: com.kevinawesomecoding.GameInstaller
          RELEASE_VERSION: ${{ needs.release_info.outputs.tag }}
          APP_DESTINATION: ${{ runner.temp }}/Game Installer.app
        run: |
          bash macos/build_preview.sh
          ditto -c -k --sequesterRsrc --keepParent "$APP_DESTINATION" "$RUNNER_TEMP/GameInstaller-macOS-arm64.zip"

      - name: Check macOS updater selection and install flow
        run: bash macos/check_updates.sh

      - name: Verify live hosted downloads with the Mac helper
        if: github.event_name == 'workflow_dispatch'
        env:
          GOFILE_PROBE_URL: ${{ inputs.gofile_probe_url }}
          FILEKEEPER_PROBE_URL: ${{ inputs.filekeeper_probe_url }}
        run: |
          for url in "$GOFILE_PROBE_URL" "$FILEKEEPER_PROBE_URL"; do
            if [[ -n "$url" ]]; then
              python3 tools/gofile_probe.py "$url" --helper "$RUNNER_TEMP/Game Installer.app/Contents/Resources/GameDownloaderMac_GameDownloaderMac.bundle/Resources/Backend/HostResolver/HostResolver"
            fi
          done

      - name: Upload Mac release file
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-files
          path: ${{ runner.temp }}/GameInstaller-macOS-arm64.zip
          if-no-files-found: error

  publish_release:
    needs: [release_info, build_windows, build_macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-release-files
          path: release-assets

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: macos-release-files
          path: release-assets

      - name: Publish combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_info.outputs.tag }}
          name: Game Installer ${{ needs.release_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/GameInstaller.zip
            release-assets/GameInstaller-windows-x64.exe
            release-assets/GameInstaller-macOS-arm64.zip
          body: |
            **Version:** ${{ needs.release_info.outputs.version }}
            **Commit:** `${{ github.sha }}`
            **Trigger:** ${{ github.event_name }}

            ### Windows x64 and Highball users
            Download **`GameInstaller-windows-x64.exe`** for the single-file app. The onedir
            folder package is **`GameInstaller.zip`**; extract it and run `GameInstaller\GameInstaller.exe`.
            The included download browser targets native Windows 11 or later. Its operation
            inside Wine/Highball has not been verified; Mac users should use the native Mac app.

            ### Native macOS users
            Download **`GameInstaller-macOS-arm64.zip`**, extract it, then open **Game Installer.app**.
            This build targets Apple silicon (arm64) and requires macOS 14 or later. The app is ad-hoc signed, so macOS may require
            opening it from Finder and approving it in Privacy & Security. Highball's
            version-matched helper can be installed from Settings. Python 3 is still
            required for readiness checks and the current Mac setup flow. The app includes
            the helper's GPL-3.0 license and corresponding source archive.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
