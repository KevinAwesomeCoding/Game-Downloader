name: Build Mac Preview

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - 'games.json'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - 'games.json'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mac preview app
        run: bash macos/build_preview.sh

      - name: Package preview
        run: ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/Game Installer Preview.app" GameInstallerMacPreview.zip

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameInstallerMacPreview
          path: GameInstallerMacPreview.zip
          if-no-files-found: error
