name: Build Mac Preview

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - 'games.json'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'spikes/highball/probe.py'
      - 'spikes/highball/readiness.py'
      - 'games.json'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mac preview app
        run: bash macos/build_preview.sh

      - name: Package preview
        run: ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/Game Installer Preview.app" GameInstallerMacPreview.zip

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameInstallerMacPreview
          path: GameInstallerMacPreview.zip
          if-no-files-found: error

      - name: Publish macOS preview release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v0.1.0-${{ github.run_number }}-${{ github.run_attempt }}
          name: Game Installer for macOS (Preview) v0.1.0 #${{ github.run_number }}
          draft: false
          prerelease: true
          files: GameInstallerMacPreview.zip
          body: |
            macOS preview build of Game Installer.

            **Source commit:** `${{ github.sha }}`
            **Trigger:** ${{ github.event_name }}

            This preview is ad-hoc signed and intended for testing. It requires macOS 14 or later.
